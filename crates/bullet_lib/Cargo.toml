[package]
name = "bullet_lib"
version = "1.0.0"
description = "Neural Network Trainer"
authors = { workspace = true }
license = { workspace = true }
repository = { workspace = true }
readme = { workspace = true }
rust-version = { workspace = true }
edition = { workspace = true }

[features]
default = ["cuda"]
cpu = []
cuda = ["bullet_cuda_backend"]
# LayerStack を P8H2(進行度8×持駒2=16 bucket)専用でビルドする。
# shogi_layerstack example の NUM_BUCKETS を 16 に切り替え、--bucket-mode progress8hand2kpabs
# のみを受理する(既定ビルドは 8 bucket = progress8 / P4H2 用)。C++ 推論の -DP2_LSMODE_P8H2 と対称。
lsmode-p8h2 = []
# 2026-11-14 OPNARCH: OPN (序盤帯専用 net) の king bucket。 shogi_layerstack の NUM_BUCKETS を
#   81 (k9k9z、 --bucket-mode opnk9z) / 243 (k9k9z × 進行度 3、 --bucket-mode opnk9zp3) にする。
#   どちらも fc0/fc1/fc2 を gather affine で回し、 arch に "LSMODE=K9Z," / "LSMODE=K9ZP3," が付く。
lsmode-opn81 = []
lsmode-opn243 = []
hip = ["bullet_hip_backend", "bullet_hip_backend/hip", "bullet_cuda_backend?/error"]
hip-cuda = ["bullet_hip_backend"]
multigpu = ["bullet_cuda_backend/nccl"]
# Threat profile gate. canonical test を除外するために使う build-time フラグ。
# 通常の build では無効 (= canonical test 有効)。
threat-profile-same-class = []
threat-profile-same-class-major-pawn = []

[dependencies]
acyclib = { workspace = true }
bullet_cuda_backend = { workspace = true, optional = true }
bullet_hip_backend = { workspace = true, optional = true }
bulletformat = { workspace = true }
montyformat = { workspace = true }
sfbinpack = "0.6.0"
viriformat = { workspace = true }
# Activity-Risk Head 用 (= 2026-06-06、 推論側 rshogi-core::nnue::activity_risk と完全一致を保証)。
# rshogi-core はラム将棋 (SH11235/rshogi) 派生の p2shogi 版を使う。 bullet-shogi と同じ親ディレクトリに置く前提。
# 必要なのは bitboard + Position + nnue::activity_risk のみ。 layerstacks-1536x16x32 は
# rshogi-core 内部で参照されるが evaluate 経路を bullet 側で呼ばないので link cost は最小。
# local 訓練用に絶対パスへ変更 (= VM では ../../../rshogi/crates/rshogi-core、 commit しない)。
rshogi-core = { path = "../../../rshogi/crates/rshogi-core", features = ["nnue-activity-risk-psqt", "nnue-king-escape-psqt", "nnue-king-danger-psqt", "nnue-attack-dev-psqt", "nnue-slider-xray-psqt", "nnue-king-mobility-psqt", "nnue-drop-pressure-psqt", "nnue-attack-relay", "nnue-attack-relay-v2", "nnue-kzt-psqt"] }

[dev-dependencies]
clap = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

