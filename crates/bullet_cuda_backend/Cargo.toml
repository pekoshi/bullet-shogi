[package]
name = "bullet_cuda_backend"
version = "0.1.0"
authors = { workspace = true }
license = { workspace = true }
repository = { workspace = true }
readme = { workspace = true }
rust-version = { workspace = true }
edition = { workspace = true }

[features]
error = []
nccl = ["cudarc/nccl"]
# cudnn は 1050 Ti (sm_61) で EXECUTION_FAILED するため使わない。
# 将来 sm_70+ GPU 用に optional 残置 (default 無効)。
cudnn = ["cudarc/cudnn"]

[dependencies]
acyclib = { workspace = true }
cudarc = { version = "=0.17.3", features = ["cuda-version-from-build-system", "f16"] }
half = "2"
parking_lot = { workspace = true }